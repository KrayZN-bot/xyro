<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Xyro</title>

<script src="https://unpkg.com/lucide@latest"></script>

<style>

* {
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Inter,Arial,sans-serif;
}


body {

    min-height:100vh;

    background:
    radial-gradient(
        circle at top,
        rgba(0,255,213,.12),
        transparent 45%
    ),

    linear-gradient(
        180deg,
        #000A14,
        #00060D
    );

    color:white;
    overflow-x:hidden;

}


/* NAVBAR */

nav {

    position:fixed;

    top:25px;

    left:50%;

    transform:translateX(-50%);

    width:90%;

    max-width:1200px;

    height:70px;

    padding:0 25px;


    display:flex;

    align-items:center;

    justify-content:space-between;


    background:

    rgba(255,255,255,.04);


    border:

    1px solid rgba(255,255,255,.08);


    backdrop-filter:blur(25px);


    border-radius:22px;


    z-index:100;


}



.nav-left {

    display:flex;

    align-items:center;

    gap:12px;

    font-size:22px;

    font-weight:800;

}



.nav-left img {

    width:42px;

    height:42px;

    object-fit:contain;

}



.nav-links {

    display:flex;

    gap:32px;

}



.nav-links a {

    display:flex;

    align-items:center;

    gap:8px;


    color:#89949b;

    text-decoration:none;

    font-size:15px;

    transition:.3s;

}


.nav-links a:hover,
.nav-links .active {

    color:white;

}


.nav-links svg {

    width:16px;

    height:16px;

}



.discord {

    display:flex;

    align-items:center;

    gap:8px;


    padding:12px 22px;

    border-radius:14px;


    text-decoration:none;

    color:white;


    background:

    linear-gradient(
        135deg,
        #00ffd5,
        #00aaff
    );


    font-weight:700;


    box-shadow:

    0 0 30px rgba(0,255,213,.25);


    transition:.3s;

}


.discord:hover {

    transform:translateY(-3px);

}


.discord svg {

    width:18px;

}



/* HERO */


.hero {

    min-height:100vh;

    padding-top:120px;


    display:flex;

    align-items:center;

    justify-content:center;

    flex-direction:column;

    text-align:center;

}



.hero h1 {

    max-width:1000px;


    font-size:75px;


    line-height:1.05;


    font-weight:900;


    letter-spacing:-4px;

}



.gradient {

    background:

    linear-gradient(
        90deg,
        #00ffd5,
        #00aaff
    );


    -webkit-background-clip:text;


    color:transparent;

}



.hero p {

    margin-top:30px;


    max-width:650px;


    color:#9ca8af;


    font-size:20px;


    line-height:1.7;

}



.button {


    margin-top:40px;


    padding:16px 45px;


    display:flex;

    align-items:center;

    gap:10px;


    border-radius:14px;


    border:2px solid #00ffd5;


    background:#000A14;


    color:white;


    font-size:16px;


    font-weight:700;


    cursor:pointer;


    box-shadow:

    0 0 35px rgba(0,255,213,.3);


}



/* SHOWCASE */


.slider {

    width:100%;

    overflow:hidden;

    padding-bottom:80px;

}



.showcase {

    display:flex;

    gap:25px;

    width:max-content;

    animation:scroll 25s linear infinite;

}



.card {

    width:430px;

    height:250px;


    overflow:hidden;


    border-radius:22px;


    border:

    1px solid rgba(255,255,255,.1);


    background:

    rgba(255,255,255,.04);


}



.card img {

    width:100%;

    height:100%;


    object-fit:cover;

}



@keyframes scroll {

    from {

        transform:translateX(0);

    }

    to {

        transform:translateX(-50%);

    }

}



@media(max-width:900px){


.nav-links {

display:none;

}


.hero h1 {

font-size:45px;

}


.card {

width:300px;

height:180px;

}


}


</style>

</head>


<body>



<nav>


<div class="nav-left">

<img src="assets/logo.png">

<span>Xyro</span>

</div>



<div class="nav-links">


<a class="active" href="#">

<i data-lucide="home"></i>

Home

</a>


<a href="#">

<i data-lucide="box"></i>

Products

</a>


<a href="#">

<i data-lucide="sparkles"></i>

Features

</a>


<a href="#">

<i data-lucide="book-open"></i>

Docs

</a>


</div>



<div class="search">

<i data-lucide="search"></i>

<input 
type="text" 
placeholder="Search Xyro..."
>

</div>





<section class="hero">


<h1>

Built for the next generation of

<span class="gradient">

Roblox communities

</span>

</h1>



<p>

Xyro gives ERLC communities powerful tools,
automation and systems built for modern servers.

</p>



<button class="button">

<i data-lucide="rocket"></i>

Get Started

</button>


</section>





<div class="slider">

<div class="showcase" id="showcase"></div>

</div>





<script>


lucide.createIcons();



const images = [

"assets/showcase/image1.png",

"assets/showcase/image2.png",

"assets/showcase/image3.png"

];


const showcase = document.getElementById("showcase");



images.concat(images).forEach((img)=>{


let card = document.createElement("div");


card.className="card";


card.innerHTML = `

<img src="${img}">

`;


showcase.appendChild(card);


});


</script>


</body>

</html>
