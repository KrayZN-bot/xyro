<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Xyro</title>

<script src="https://unpkg.com/lucide@latest"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Inter,Arial,sans-serif;
}

body{

min-height:100vh;

background:

radial-gradient(
circle at 50% 0%,
rgba(0,120,160,.10),
transparent 45%
),

radial-gradient(
circle at 80% 20%,
rgba(0,255,213,.05),
transparent 35%
),

linear-gradient(
180deg,
#00060D,
#00030A
);


color:white;

overflow-x:hidden;

}


/* NAV */

nav{

position:fixed;
top:25px;
left:50%;
transform:translateX(-50%);

width:90%;
max-width:1200px;

height:72px;
padding:0 25px;

display:flex;
align-items:center;
justify-content:space-between;

background:rgba(255,255,255,.04);
border:1px solid rgba(255,255,255,.08);

backdrop-filter:blur(25px);

border-radius:22px;

z-index:10;

}


.nav-left{

display:flex;
align-items:center;
gap:12px;

font-size:22px;
font-weight:800;

}


.nav-left img{

width:42px;
height:42px;
object-fit:contain;

}



.nav-links{

display:flex;
gap:32px;

}



.nav-links a{

display:flex;
align-items:center;
gap:8px;

color:#89949b;
text-decoration:none;

font-size:15px;

transition:.3s;

}


.nav-links a:hover,
.nav-links .active{

color:white;

}



.nav-links svg{

width:16px;
height:16px;

}



/* SEARCH */

.search{

display:flex;
align-items:center;

gap:10px;

width:230px;
height:42px;

padding:0 15px;

border-radius:14px;

background:rgba(255,255,255,.05);

border:1px solid rgba(255,255,255,.1);

}



.search svg{

width:18px;
color:#89949b;

}


.search input{

width:100%;

background:none;

border:none;

outline:none;

color:white;

}


.search input::placeholder{

color:#89949b;

}



/* HERO */

.hero{

padding-top:150px;
padding-bottom:50px;

display:flex;

align-items:center;
justify-content:center;

flex-direction:column;

text-align:center;

}



.hero h1{

max-width:900px;

font-size:64px;

line-height:1.1;

letter-spacing:-3px;

font-weight:900;

}



.gradient{

background:linear-gradient(
90deg,
#00ffd5,
#00aaff
);

-webkit-background-clip:text;

color:transparent;

}



.hero p{

margin-top:20px;

max-width:600px;

color:#9ca8af;

font-size:18px;

line-height:1.6;

}



/* SHOWCASE */


.slider{

width:100%;

overflow:hidden;

padding-bottom:70px;

margin-top:60px;

}



.showcase{

display:flex;

gap:25px;

width:max-content;

animation:scroll 25s linear infinite;

}



.card{

width:430px;

height:250px;

border-radius:22px;

overflow:hidden;

border:1px solid rgba(255,255,255,.1);

background:rgba(255,255,255,.04);

}



.card img{

width:100%;

height:100%;

object-fit:cover;

}



@keyframes scroll{

from{
transform:translateX(0);
}

to{
transform:translateX(-50%);
}

}



@media(max-width:900px){

.nav-links{
display:none;
}

.search{
width:160px;
}

.hero h1{
font-size:45px;
}

.card{

width:300px;
height:180px;

}

}


</style>

</head>


<body>


<nav>

<div class="nav-left">

<img src="assets/logo.png">

<span>Xyro</span>

</div>


<div class="nav-links">

<a class="active">

<i data-lucide="home"></i>

Home

</a>


<a>

<i data-lucide="box"></i>

Products

</a>


<a>

<i data-lucide="sparkles"></i>

Features

</a>


<a>

<i data-lucide="book-open"></i>

Docs

</a>

</div>



<div class="search">

<i data-lucide="search"></i>

<input placeholder="Search Xyro...">

</div>


</nav>



<section class="hero">

<h1>

Built for the next generation of

<span class="hero italic">

Roblox communities

</span>

</h1>


<p>

Xyro gives ERLC communities powerful tools,
automation and systems built for modern servers.

</p>

</section>



<div class="slider">

<div class="showcase" id="showcase"></div>

</div>



<script>

lucide.createIcons();


const images=[

"assets/showcase/image1.png",

"assets/showcase/image2.png",

"assets/showcase/image3.png"

];


const showcase=document.getElementById("showcase");


images.concat(images).forEach(img=>{


const card=document.createElement("div");

card.className="card";


card.innerHTML=`

<img src="${img}">

`;


showcase.appendChild(card);


});

</script>


</body>
</html>
