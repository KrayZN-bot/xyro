<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Xyro | Roblox Communities</title>

<style>

* {
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Inter,Arial,sans-serif;
}


body {

    min-height:100vh;

    background:
    radial-gradient(
        700px circle at 50% 0%,
        rgba(0,255,180,.12),
        transparent 60%
    ),

    linear-gradient(
        180deg,
        #000A14,
        #00060D
    );

    color:white;
    overflow-x:hidden;

}



/* NAVBAR */

nav {

    height:80px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:0 5%;

    border-bottom:
    1px solid rgba(255,255,255,.05);

}


.logo {

    display:flex;

    align-items:center;

    gap:12px;

    font-size:22px;

    font-weight:700;

}


.logo img {

    width:45px;

    height:45px;

    object-fit:contain;

}



.links {

    display:flex;

    gap:40px;

}


.links a {

    color:#b8c2c8;

    text-decoration:none;

    font-size:15px;

    transition:.3s;

}


.links a:hover {

    color:white;

}



.login {

    border:1px solid rgba(255,255,255,.15);

    padding:12px 22px;

    border-radius:12px;

    color:white;

}



/* HERO */


.hero {

    height:700px;

    display:flex;

    align-items:center;

    justify-content:center;

    text-align:center;

    flex-direction:column;

}


.hero h1 {

    max-width:1100px;

    font-size:70px;

    line-height:1.1;

    font-weight:800;

    letter-spacing:-3px;

}


.gradient {

    background:

    linear-gradient(
        90deg,
        #00ffd5,
        #00aaff
    );

    -webkit-background-clip:text;

    color:transparent;

}



.hero p {

    margin-top:35px;

    max-width:650px;

    color:#b6c2c9;

    font-size:20px;

    line-height:1.7;

}



.button {

    margin-top:40px;

    padding:16px 55px;

    border-radius:12px;

    background:#000A14;

    color:white;

    border:2px solid #00ffd5;

    font-size:16px;

    font-weight:700;

    cursor:pointer;

    box-shadow:

    0 0 30px rgba(0,255,213,.35);

    transition:.3s;

}


.button:hover {

    transform:translateY(-4px);

    box-shadow:

    0 0 50px rgba(0,255,213,.6);

}



/* SHOWCASE */


.showcase {

    display:flex;

    gap:25px;

    width:max-content;

    animation:slide 25s linear infinite;

}


.wrapper {

    overflow:hidden;

    padding-bottom:80px;

}



.card {

    width:420px;

    height:240px;

    border-radius:20px;

    overflow:hidden;

    border:

    1px solid rgba(255,255,255,.08);


    background:

    rgba(255,255,255,.04);

    backdrop-filter:blur(20px);

}



.card img {

    width:100%;

    height:100%;

    object-fit:cover;

}



@keyframes slide {

    from {

        transform:translateX(0);

    }


    to {

        transform:translateX(-50%);

    }

}



/* MOBILE */


@media(max-width:800px){


.hero h1 {

font-size:45px;

}


.links {

display:none;

}


.card {

width:300px;

height:180px;

}


}



</style>

</head>


<body>



<nav>


<div class="logo">

<img src="assets/logo.png">

<span>Xyro</span>

</div>


<div class="links">

<a href="#">Dashboard</a>

<a href="#">Products</a>

<a href="#">Features</a>

<a href="#">Resources</a>

</div>


<a class="login">
Log in
</a>


</nav>




<section class="hero">


<h1>

Built for the next generation of

<span class="gradient">
Roblox communities
</span>

</h1>


<p>

Xyro provides powerful tools for ERLC communities.
Manage your departments, automate systems,
and create better experiences.

</p>


<button class="button">

Get Started

</button>


</section>




<div class="wrapper">


<div class="showcase" id="images">


</div>


</div>





<script>


const images = [

"assets/showcase/image1.png",

"assets/showcase/image2.png",

"assets/showcase/image3.png"

];



const box=document.getElementById("images");



[...images,...images].forEach(image=>{


let card=document.createElement("div");


card.className="card";


card.innerHTML=`

<img src="${image}">

`;


box.appendChild(card);


});



</script>



</body>
</html>
