<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Xyro</title>

<script src="https://unpkg.com/lucide@latest"></script>

<style>

* {
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Inter,Arial,sans-serif;
}

body {

    min-height:100vh;

    background:
    radial-gradient(
        circle at top,
        rgba(0,255,213,0.13),
        transparent 45%
    ),

    linear-gradient(
        180deg,
        #000A14,
        #00060D
    );

    color:white;
    overflow-x:hidden;

}


/* NAVBAR */

nav {

    position:fixed;

    top:25px;

    left:50%;

    transform:translateX(-50%);

    width:90%;

    max-width:1200px;

    height:72px;

    padding:0 25px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    background:
    rgba(255,255,255,.04);

    border:
    1px solid rgba(255,255,255,.08);

    backdrop-filter:blur(25px);

    border-radius:22px;

    z-index:100;

}


.nav-left {

    display:flex;

    align-items:center;

    gap:12px;

    font-size:22px;

    font-weight:800;

}


.nav-left img {

    width:42px;

    height:42px;

    object-fit:contain;

}



.nav-links {

    display:flex;

    gap:32px;

}


.nav-links a {

    display:flex;

    align-items:center;

    gap:8px;

    color:#89949b;

    text-decoration:none;

    font-size:15px;

    transition:.3s;

}


.nav-links a:hover,
.nav-links .active {

    color:white;

}


.nav-links svg {

    width:16px;

    height:16px;

}


/* SEARCH */

.search {

    display:flex;

    align-items:center;

    gap:10px;

    width:230px;

    height:42px;

    padding:0 15px;

    border-radius:14px;

    background:
    rgba(255,255,255,.05);

    border:
    1px solid rgba(255,255,255,.1);

}


.search svg {

    width:18px;

    color:#89949b;

}


.search input {

    width:100%;

    background:none;

    border:none;

    outline:none;

    color:white;

}


.search input::placeholder {

    color:#89949b;

}


/* HERO */

.hero {

    min-height:75vh;

    padding-top:120px;

    padding-bottom:20px;

    display:flex;

    justify-content:center;

    align-items:center;

    flex-direction:column;

    text-align:center;

}


.hero h1 {

    max-width:1000px;

    font-size:75px;

    line-height:1.05;

    letter-spacing:-4px;

    font-weight:900;

}


.gradient {

    background:

    linear-gradient(
        90deg,
        #00ffd5,
        #00aaff
    );

    -webkit-background-clip:text;

    color:transparent;

}


.hero p {

    margin-top:30px;

    max-width:650px;

    color:#9ca8af;

    font-size:20px;

    line-height:1.7;

}


/* SHOWCASE */

.slider {

    width:100%;

    overflow:hidden;

    padding-bottom:40px;

    margin-top:-70px;

}


.showcase {

    display:flex;

    gap:25px;

    width:max-content;

    animation:scroll 25s linear infinite;

}


.card {

    width:430px;

    height:250px;

    border-radius:22px;

    overflow:hidden;

    border:

    1px solid rgba(255,255,255,.1);

    background:

    rgba(255,255,255,.04);

}


.card img {

    width:100%;

    height:100%;

    object-fit:cover;

}
