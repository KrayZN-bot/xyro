<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Xyro</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Inter, Arial, sans-serif;
}


body {

    min-height:100vh;

    background:
    radial-gradient(
        circle at top,
        rgba(0,255,200,0.15),
        transparent 45%
    ),

    linear-gradient(
        180deg,
        #000A14,
        #00060D
    );

    color:white;
    overflow-x:hidden;

}


/* NAVBAR */

nav {

    height:90px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:0 7%;

}


.logo {

    display:flex;

    align-items:center;

    gap:12px;

    font-size:24px;

    font-weight:800;

}


.logo img {

    width:50px;

    height:50px;

    object-fit:contain;

}



.links {

    display:flex;

    gap:35px;

}


.links a {

    color:#9ba8af;

    text-decoration:none;

    transition:.3s;

}


.links a:hover {

    color:white;

}



.login {

    padding:12px 25px;

    border-radius:12px;

    border:1px solid rgba(255,255,255,.15);

}



/* HERO */


.hero {

    height:650px;

    display:flex;

    justify-content:center;

    align-items:center;

    flex-direction:column;

    text-align:center;

}


.hero h1 {

    max-width:1000px;

    font-size:72px;

    line-height:1.05;

    letter-spacing:-4px;

    font-weight:900;

}


.gradient {

    background:

    linear-gradient(
        90deg,
        #00ffd5,
        #00aaff
    );

    -webkit-background-clip:text;

    color:transparent;

}



.hero p {

    margin-top:35px;

    max-width:650px;

    font-size:20px;

    color:#9ca8af;

    line-height:1.7;

}



.hero button {

    margin-top:40px;

    padding:16px 50px;

    border-radius:14px;

    border:2px solid #00ffd5;

    background:#000A14;

    color:white;

    font-size:16px;

    font-weight:700;

    cursor:pointer;

    box-shadow:

    0 0 40px rgba(0,255,213,.35);

}



/* SHOWCASE */


.slider {

    width:100%;

    overflow:hidden;

    padding-bottom:80px;

}



.showcase {

    display:flex;

    gap:25px;

    width:max-content;

    animation:scroll 25s linear infinite;

}



.card {

    width:430px;

    height:250px;

    border-radius:22px;

    overflow:hidden;

    background:rgba(255,255,255,.04);

    border:1px solid rgba(255,255,255,.1);

    backdrop-filter:blur(20px);

}



.card img {

    width:100%;

    height:100%;

    object-fit:cover;

}



@keyframes scroll {

    from {

        transform:translateX(0);

    }

    to {

        transform:translateX(-50%);

    }

}



@media(max-width:800px){

.hero h1 {

    font-size:45px;

}


.links {

    display:none;

}


.card {

    width:300px;

    height:180px;

}

}


</style>


</head>


<body>


<nav>

<div class="logo">

<img src="assets/logo.png">

<span>Xyro</span>

</div>


<div class="links">

<a href="#">Home</a>

<a href="#">Features</a>

<a href="#">Products</a>

<a href="#">Resources</a>

</div>


<div class="login">

Login

</div>


</nav>




<section class="hero">


<h1>

Built for the next generation of

<span class="gradient">

Roblox communities

</span>

</h1>


<p>

Xyro gives ERLC communities powerful tools,
automation and systems built for modern servers.

</p>


<button>

Get Started

</button>


</section>




<div class="slider">


<div class="showcase" id="showcase">


</div>


</div>





<script>


const images = [

"assets/showcase/image1.png",

"assets/showcase/image2.png",

"assets/showcase/image3.png"

];


const showcase = document.getElementById("showcase");



// Create cards

images.concat(images).forEach((img)=>{


const card = document.createElement("div");


card.className="card";


card.innerHTML = `

<img src="${img}">

`;


showcase.appendChild(card);


});


</script>



</body>

</html>
